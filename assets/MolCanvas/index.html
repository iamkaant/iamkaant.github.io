<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MolCanvas — chemical structure editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex drives the UI; Roboto/Noto remain available to the document styles. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Roboto:ital,wght@0,400;0,700;1,400&family=Roboto+Mono&family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so the app never flashes the wrong one.
      try {
        var t = localStorage.getItem("molcanvas.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) { /* private mode: stay light */ }
    </script>
    <script type="module" crossorigin src="./assets/index-NoeMmESS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BbaEY6JO.css">
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span class="brand">
          <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <polygon points="12,2.6 20.1,7.3 20.1,16.7 12,21.4 3.9,16.7 3.9,7.3"
                     fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.7" stroke-linejoin="round" />
            <circle cx="12" cy="12" r="2.3" fill="var(--accent)" />
          </svg>
          <span>Mol<span class="brand-accent">Canvas</span></span>
        </span>
        <nav id="menubar" aria-label="Menu"></nav>
        <span class="topbar-spacer"></span>
        <button id="theme-toggle" class="theme-toggle" type="button" title="Dark mode" aria-label="Toggle dark mode"></button>
      </header>
      <div id="workspace">
        <nav id="toolbar" aria-label="Drawing tools">
          <div class="panel-grip" id="toolbar-grip" title="Drag to move"></div>
        </nav>
        <main id="canvas-host">
          <canvas id="scene"></canvas>
          <div id="quickbar" aria-label="Quick actions">
            <div class="panel-grip" id="quickbar-grip" title="Drag to move"></div>
          </div>
          <div id="compound-table" class="hidden" aria-label="Compound table editor"></div>
          <div id="statusbar"></div>
        </main>
        <aside id="sidebar" aria-label="Inspector and properties">
          <div id="templates"></div>
          <div id="inspector"></div>
          <div id="props"></div>
        </aside>
      </div>
      <input id="file-input" type="file" accept=".mol,.sdf,.cdx,.cdxml,.txt,.smi,.smiles,.cxsmi,.cxsmiles,.csv,.tsv" hidden />
    </div>
  </body>
</html>
